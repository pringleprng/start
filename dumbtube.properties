# [DumbTube] Fork settings used by smarttubetv/dumbtube.gradle.
#
# repo: GitHub "owner/name" of the DumbTube fork. The in-app updater downloads
#       https://github.com/<repo>/releases/latest/download/dumbtube.json
#       CI builds override this automatically with the repository they run in
#       (GITHUB_REPOSITORY), so this value only matters for local builds.
repo=pringleprng/start
