# [DumbTube] Compile check + DumbTube unit tests on every push (no signing, nothing published).
name: DumbTube Check

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStdumbtubeDebug

      # Separate Gradle run on purpose: task names containing "Ststable" make upstream's build.gradle
      # apply the Google Services plugin, which must not happen in the same run as DumbTube tasks.
      - name: DumbTube unit tests
        run: ./gradlew --no-daemon :common:testStstableDebugUnitTest --tests '*dumbtube*'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dumbtube-test-report
          path: common/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DumbTube-debug
          path: smarttubetv/build/outputs/apk/stdumbtube/debug/DumbTube-*.apk
          if-no-files-found: error
